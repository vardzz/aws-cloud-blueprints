                    - Message:
                        PlainTextMessage:
                          Value: |-
                            Jericho specializes in a production-focused full-stack architecture that combines Next.js, React, Tailwind CSS, and TypeScript for high-velocity frontend delivery, paired with Supabase and AWS serverless services for scalable backend operations.

                            His implementation strategy emphasizes modular codebases, clean component contracts, and deployment stability across cloud-native workflows.

                            Beyond application engineering, he also integrates Blender-driven 3D assets into interactive digital experiences where visual systems are required.

