AWSTemplateFormatVersion: "2010-09-09"
Description: "Automated Cloud Blueprint for Jericho Portfolio Chatbot Infrastructure"

Resources:
  # 1. SECURITY & ACCESSIBILITY PERMISSIONS
  LexBotExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lexv2.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonLexFullAccess"

  # 2. AMAZON LEX BOT CONTEXT & GLOBAL DATA
  PortfolioAssistantBot:
    Type: "AWS::Lex::Bot"
    Properties:
      Name: "PortfolioAssistant_IaC"
      DataPrivacy:
        ChildDirected: false
      IdleSessionTTLInSeconds: 300
      RoleArn: !GetAtt LexBotExecutionRole.Arn
      TestBotAliasSettings: {}
      BotLocales:
        - LocaleId: "en_US"
          NluConfidenceThreshold: 0.30
          Description: "English locale mapping for portfolio NLU system"
          Intents:
            - Name: "FallbackIntent"
              Description: "Default intent triggered when user input cannot be classified."
              ParentIntentSignature: "AMAZON.FallbackIntent"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Sorry, that request did not match a supported topic.
                            This is Jeje, Jericho's portfolio assistant, and Jeje
                            can help with his tech stack, featured projects,
                            contact details, general background, or a meeting
                            request.

            - Name: "AskGreeting"
              Description: "Handles casual greetings and establishes the assistant identity."
              SampleUtterances:
                - Utterance: "yo"
                - Utterance: "hi"
                - Utterance: "hello"
                - Utterance: "hey"
                - Utterance: "greetings"
                - Utterance: "good day"
                - Utterance: "hiya"
                - Utterance: "heyy"
                - Utterance: "hello there"
                - Utterance: "good morning"
                - Utterance: "good afternoon"
                - Utterance: "good evening"
                - Utterance: "sup"
                - Utterance: "whats up"
                - Utterance: "yo jeje"
                - Utterance: "hi jeje"
                - Utterance: "hey assistant"
                - Utterance: "hello bot"
                - Utterance: "start"
                - Utterance: "start chat"
                - Utterance: "begin"
                - Utterance: "can we talk"
                - Utterance: "is anyone there"
                - Utterance: "ping"
                - Utterance: "hello portfolio assistant"
                - Utterance: "hey there"
                - Utterance: "good to see you"
                - Utterance: "hola"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Hi there! This is Jeje, Jericho's portfolio assistant.
                            Jeje is trained to help you navigate his engineering
                            profile. You can ask about his tech stack, notable
                            works, contact information, or type 'schedule a
                            meeting' to book an interview slot!

