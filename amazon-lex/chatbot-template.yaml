                        PlainTextMessage:
                          Value: |-
                            Dentara is Jericho's healthtech Progressive Web App that aligns dentistry students with clinical patients based on treatment-specific requirements and case-fit criteria.

                            The platform is designed as an operational bridge between academic clinical demand and patient matching logistics, improving case accessibility, reducing coordination friction, and supporting a more structured care-aligned workflow.

                            Dentara represents a practical product layer where healthcare process design is translated into a usable, scalable web system.

