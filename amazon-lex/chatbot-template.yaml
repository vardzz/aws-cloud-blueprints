AWSTemplateFormatVersion: "2010-09-09"
Description: "Automated Cloud Blueprint for Jericho Portfolio Chatbot Infrastructure"

Resources:
  # 1. SECURITY & ACCESSIBILITY PERMISSIONS
  LexBotExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lexv2.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonLexFullAccess"

  # 2. AMAZON LEX BOT CONTEXT & GLOBAL DATA
  PortfolioAssistantBot:
    Type: "AWS::Lex::Bot"
    Properties:
      Name: "PortfolioAssistant_IaC"
      DataPrivacy:
        ChildDirected: false
      IdleSessionTTLInSeconds: 300
      RoleArn: !GetAtt LexBotExecutionRole.Arn
      TestBotAliasSettings: {}
      BotLocales:
        - LocaleId: "en_US"
          NluConfidenceThreshold: 0.4
          Description: "English locale mapping for portfolio NLU system"
          Intents:
            - Name: "FallbackIntent"
              Description: "Default intent triggered when user input cannot be classified."
              ParentIntentSignature: "AMAZON.FallbackIntent"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Sorry, that request did not match a supported topic.
                            This is Jeje, Jericho's portfolio assistant, and Jeje
                            can help with his tech stack, featured projects,
                            contact details, general background, or a meeting
                            request.
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "AskGreeting"
              Description: "Handles casual greetings and establishes the assistant identity."
              SampleUtterances:
                - Utterance: "yo"
                - Utterance: "hi"
                - Utterance: "hello"
                - Utterance: "hey"
                - Utterance: "greetings"
                - Utterance: "good day"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Hi there! This is Jeje, Jericho's portfolio assistant.
                            Jeje is trained to help you navigate his engineering
                            profile. You can ask about his tech stack, notable
                            works, contact information, or type 'schedule a
                            meeting' to book an interview slot!
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "AskTechStack"
              Description: "Answers inquiries regarding software languages and stack proficiencies."
              SampleUtterances:
                - Utterance: "What is your tech stack?"
                - Utterance: "What programming languages do you know?"
                - Utterance: "What technologies do you use?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Jericho specializes in a modern full-stack ecosystem
                            including Next.js, React, Tailwind CSS, TypeScript,
                            Supabase, and AWS Serverless infrastructure. He also
                            uses Blender for 3D modeling and animation.
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "AskDentaraProject"
              Description: "Provides a focused summary of Jericho's flagship healthcare application, Dentara."
              SampleUtterances:
                - Utterance: "Tell me about Dentara"
                - Utterance: "What is Dentara?"
                - Utterance: "Show me your dental project"
                - Utterance: "What healthcare apps have you built?"
                - Utterance: "Dentara PWA"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Dentara is a healthtech Progressive Web App (PWA)
                            engineered to seamlessly match dentistry students with
                            patients needing specific clinical requirements.
                            Jericho developed its business model and full-stack
                            tech stack to optimize patient-student management
                            pipelines.
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "AskWorks"
              Description: "Outputs references to engineered system solutions."
              SampleUtterances:
                - Utterance: "What projects have you built?"
                - Utterance: "Show me your work"
                - Utterance: "What are your notable works?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Jericho's notable projects include Horizon AI, a
                            multi-agent orchestration framework; Dentara, a
                            healthtech PWA; a rapid Next.js and Supabase QR code
                            attendance tracker; and custom 3D web assets engineered
                            in Blender.
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "AskContact"
              Description: "Displays links, profiles, and active direct communication lines."
              SampleUtterances:
                - Utterance: "How can I contact you?"
                - Utterance: "What is your email address?"
                - Utterance: "How can I get in touch?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            You can email Jericho directly at vardejericho@gmail.com,
                            use the contact form on this page to trigger an instant
                            inquiry, or find Jericho on GitHub under the Sinkronizze
                            organization.
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "AskGeneralInfo"
              Description: "Replies with baseline biographical and location profiles."
              SampleUtterances:
                - Utterance: "What is your full name?"
                - Utterance: "Who are you?"
                - Utterance: "Tell me about Jericho"
                - Utterance: "Where do you study?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Jericho F. Varde is a third-year Computer Science
                            student at Pamantasan ng Cabuyao, working toward a
                            Cloud Engineer path. You can reach Jericho directly via
                            email at vardejericho@gmail.com or explore the
                            Sinkronizze GitHub organization.
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "BookMeeting"
              Description: "Interactive scheduling pipeline utilizing contextual date/time extractions."
              SampleUtterances:
                - Utterance: "I want to schedule a meeting with Jericho"
                - Utterance: "Can we set up a call?"
                - Utterance: "Book an appointment"
                - Utterance: "Are you available for an interview?"
              Slots:
                - Name: "AppointmentDate"
                  SlotTypeName: "AMAZON.Date"
                  ValueElicitationSetting:
                    SlotConstraint: "Required"
                    PromptSpecification:
                      MaxRetries: 3
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "What day would you like to schedule the meeting with Jericho?"
                - Name: "AppointmentTime"
                  SlotTypeName: "AMAZON.Time"
                  ValueElicitationSetting:
                    SlotConstraint: "Required"
                    PromptSpecification:
                      MaxRetries: 3
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "What time works best for the meeting with Jericho?"
              SlotPriorities:
                - Priority: 1
                  SlotName: "AppointmentDate"
                - Priority: 2
                  SlotName: "AppointmentTime"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Perfect! The meeting request has been noted for
                            {AppointmentDate} at {AppointmentTime}. Jericho will
                            review the request and get back to you shortly.
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "AskBotWellBeing"
              Description: "Outputs how the bot is doing in a lighthearted manner."
              SampleUtterances:
                - Utterance: "How are you?"
                - Utterance: "How is it going?"
                - Utterance: "Are you doing well?"
                - Utterance: "What's up?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Jeje is functioning at 100% efficiency. Thanks for
                            asking. Jeje is currently keeping track of Jericho's
                            portfolio, tech stack, and schedule. How can Jeje help
                            you navigate his work today?
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "AskBotCapabilities"
              Description: "Outputs on what can the bot really do, showcasing its engineered personality."
              SampleUtterances:
                - Utterance: "What can you do?"
                - Utterance: "Help me"
                - Utterance: "What are your commands?"
                - Utterance: "How do i use this?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Think of Jeje as the direct pipeline to Jericho's
                            professional profile. You can ask about his tech stack,
                            view his notable engineering works, get his active
                            contact channels, or type 'schedule a meeting' to book
                            an interview slot.
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "ExpressGratitude"
              Description: "Outputs gratitude to the user when they express thanks."
              SampleUtterances:
                - Utterance: "Thank you"
                - Utterance: "Thanks"
                - Utterance: "Awesome, thanks!"
                - Utterance: "Cool, thank you!"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            You are very welcome! Helping you navigate Jericho's
                            architecture is exactly what Jeje is built for. Let Jeje
                            know if any more details are needed about his stack or
                            availability.
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "AskBotHumor"
              Description: "Outputs a humorous response to the user."
              SampleUtterances:
                - Utterance: "Tell me a joke"
                - Utterance: "Make me laugh"
                - Utterance: "Do you know any jokes?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Why do Cloud Engineers love dark mode? Because light
                            attracts bugs. Speaking of avoiding bugs, would you like
                            to take a look at Jericho's clean, fully optimized Next.js
                            and AWS work?
                NextStep:
                  DialogAction:
                    Type: "EndConversation"

            - Name: "AskLoveLife"
              Description: "Handles inquiries regarding relationship status, showcasing a lighthearted easter egg about Kzelyn."
              SampleUtterances:
                - Utterance: "Are you single?"
                - Utterance: "Do you have a girlfriend?"
                - Utterance: "Who is Kzelyn?"
                - Utterance: "Tell me about your love life"
                - Utterance: "Are you dating anyone?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Jericho is happily taken by Kzelyn. She is not only his
                            girlfriend but also the brilliant marketing student who
                            serves as the research strategist and lead data collector
                            for his major development projects. They are a definitive
                            full-stack duo.
                NextStep:
                  DialogAction:
                    Type: "EndConversation"
