AWSTemplateFormatVersion: "2010-09-09"
Description: "Automated Cloud Blueprint for Jericho Portfolio Chatbot Infrastructure"

Resources:
  # 1. SECURITY & ACCESSIBILITY PERMISSIONS
  LexBotExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lexv2.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonLexFullAccess"

  # 2. AMAZON LEX BOT CONTEXT & GLOBAL DATA
  PortfolioAssistantBot:
    Type: "AWS::Lex::Bot"
    Properties:
      Name: "PortfolioAssistant_IaC"
      DataPrivacy:
        ChildDirected: false
      IdleSessionTTLInSeconds: 300
      RoleArn: !GetAtt LexBotExecutionRole.Arn
      TestBotAliasSettings: {}
      BotLocales:
        - LocaleId: "en_US"
          NluConfidenceThreshold: 0.30
          Description: "English locale mapping for portfolio NLU system"
          Intents:
            - Name: "FallbackIntent"
              Description: "Default intent triggered when user input cannot be classified."
              ParentIntentSignature: "AMAZON.FallbackIntent"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: |-
                            That request did not map to a supported portfolio intent.

                            Jeje serves as Jericho's professional portfolio assistant and can provide structured guidance on his technical stack, flagship systems, engineering background, communication channels, and interview scheduling workflow.

                            For best routing accuracy, concise prompts such as tech stack, Dentara details, contact hub, or book meeting will trigger the strongest intent matches.

            - Name: "AskGreeting"
              Description: "Handles casual greetings and establishes the assistant identity."
              SampleUtterances:
                - Utterance: "yo"
                - Utterance: "hi"
                - Utterance: "hello"
                - Utterance: "hey"
                - Utterance: "greetings"
                - Utterance: "good day"
                - Utterance: "hiya"
                - Utterance: "heyy"
                - Utterance: "hello there"
                - Utterance: "good morning"
                - Utterance: "good afternoon"
                - Utterance: "good evening"
                - Utterance: "sup"
                - Utterance: "whats up"
                - Utterance: "yo jeje"
                - Utterance: "hi jeje"
                - Utterance: "hey assistant"
                - Utterance: "hello bot"
                - Utterance: "start"
                - Utterance: "start chat"
                - Utterance: "begin"
                - Utterance: "can we talk"
                - Utterance: "is anyone there"
                - Utterance: "ping"
                - Utterance: "hello portfolio assistant"
                - Utterance: "hey there"
                - Utterance: "good to see you"
                - Utterance: "hola"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: |-
                            Greetings. Jeje is the official portfolio assistant for Jericho and is configured to present his engineering profile in a recruiter-ready format.

                            Jeje can guide visitors through technical competencies, project architecture summaries, live system references, and direct communication pathways.

                            To continue, request any module such as tech stack, project overview, contact hub, or book meeting.

