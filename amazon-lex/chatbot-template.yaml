  # 3. BOT VERSION — publishes the DRAFT locale into a versioned snapshot
  PortfolioAssistantBotVersion:
    Type: "AWS::Lex::BotVersion"
    DependsOn: PortfolioAssistantBot
    Properties:
      BotId: !Ref PortfolioAssistantBot
      BotVersionLocaleSpecification:
        - LocaleId: "en_US"
          BotVersionLocaleDetails:
            SourceBotVersion: "DRAFT"

  # 4. BOT ALIAS — stable endpoint your Lex web widget connects to
  PortfolioAssistantBotAlias:
    Type: "AWS::Lex::BotAlias"
    DependsOn: PortfolioAssistantBotVersion
    Properties:
      BotId: !Ref PortfolioAssistantBot
      BotAliasName: "ProductionAlias"
      BotVersion: !GetAtt PortfolioAssistantBotVersion.BotVersion
      SentimentAnalysisSettings:
        DetectSentiment: false

# 5. OUTPUTS — surface the IDs your frontend widget needs
Outputs:
  BotId:
    Description: "Lex Bot ID — use in your web widget config"
    Value: !Ref PortfolioAssistantBot

  BotAliasId:
    Description: "Lex Bot Alias ID — use in your web widget config"
    Value: !GetAtt PortfolioAssistantBotAlias.BotAliasId

  BotLocaleId:
    Description: "Locale used by the bot"
    Value: "en_US"
