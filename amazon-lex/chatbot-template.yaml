AWSTemplateFormatVersion: "2010-09-09"
Description: "Automated Cloud Blueprint for Jericho Portfolio Chatbot Infrastructure"

Resources:
  # 1. SECURITY & ACCESSIBILITY PERMISSIONS
  LexBotExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lexv2.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonLexFullAccess"

  # 2. AMAZON LEX BOT CONTEXT & GLOBAL DATA
  PortfolioAssistantBot:
    Type: "AWS::Lex::Bot"
    Properties:
      Name: "PortfolioAssistant_IaC"
      DataPrivacy:
        ChildDirected: false
      IdleSessionTTLInSeconds: 300
      RoleArn: !GetAtt LexBotExecutionRole.Arn
      TestBotAliasSettings: {}
      BotLocales:
        - LocaleId: "en_US"
          NluConfidenceThreshold: 0.4
          Description: "English locale mapping for portfolio NLU system"
          Intents:
            - Name: "FallbackIntent"
              Description: "Default intent triggered when user input cannot be classified."
              ParentIntentSignature: "AMAZON.FallbackIntent"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            I didn't quite catch that. I am Jericho's Portfolio
                            Assistant, and I am trained to help you with specific
                            inquiries. You can ask me about his tech stack, view
                            his notable works, request his general contact info,
                            or type 'schedule a meeting' to book an interview!
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"

            - Name: "AskTechStack"
              Description: "Answers inquiries regarding software languages and stack proficiencies."
              SampleUtterances:
                - Utterance: "What is your tech stack?"
                - Utterance: "What programming languages do you know?"
                - Utterance: "What technologies do you use?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            I specialize in a modern full-stack ecosystem
                            including Next.js, React, Tailwind CSS, TypeScript,
                            Supabase, and AWS Serverless infrastructure. I also
                            utilize Blender for 3D modeling and animation.
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"

            - Name: "AskWorks"
              Description: "Outputs references to engineered system solutions."
              SampleUtterances:
                - Utterance: "What projects have you built?"
                - Utterance: "Show me your work"
                - Utterance: "What are your notable works?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Some of my notable projects include Horizon AI (a
                            multi-agent orchestration framework), Dentara (a
                            healthtech PWA), a rapid Next.js + Supabase QR Code
                            attendance tracker, and custom 3D web assets engineered
                            in Blender.
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"

            - Name: "AskContact"
              Description: "Displays links, profiles, and active direct communication lines."
              SampleUtterances:
                - Utterance: "How can I contact you?"
                - Utterance: "What is your email address?"
                - Utterance: "How can I get in touch?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            You can email me directly at vardejericho@gmail.com,
                            use the contact form on this page to trigger an
                            instant inquiry, or find me on GitHub under my
                            organization name, Sinkronizze.
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"

            - Name: "AskGeneralInfo"
              Description: "Replies with baseline biographical and location profiles."
              SampleUtterances:
                - Utterance: "What is your full name?"
                - Utterance: "Who are you?"
                - Utterance: "Tell me about Jericho"
                - Utterance: "Where do you study?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            My full name is Jericho F. Varde. I am a third-year
                            Computer Science student at Pamantasan ng Cabuyao,
                            working toward becoming a Cloud Engineer. You can
                            reach me directly via email at vardejericho@gmail.com
                            or explore my GitHub organization, Sinkronizze!
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"

            - Name: "BookMeeting"
              Description: "Interactive scheduling pipeline utilizing contextual date/time extractions."
              SampleUtterances:
                - Utterance: "I want to schedule a meeting with Jericho"
                - Utterance: "Can we set up a call?"
                - Utterance: "Book an appointment"
                - Utterance: "Are you available for an interview?"
              Slots:
                - Name: "AppointmentDate"
                  SlotTypeName: "AMAZON.Date"
                  ValueElicitationSetting:
                    SlotConstraint: "Required"
                    PromptSpecification:
                      MaxRetries: 3
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "What day would you like to schedule the meeting?"
                - Name: "AppointmentTime"
                  SlotTypeName: "AMAZON.Time"
                  ValueElicitationSetting:
                    SlotConstraint: "Required"
                    PromptSpecification:
                      MaxRetries: 3
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: "What time works best for you?"
              SlotPriorities:
                - Priority: 1
                  SlotName: "AppointmentDate"
                - Priority: 2
                  SlotName: "AppointmentTime"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Perfect! I have noted down your request for a meeting
                            on {AppointmentDate} at {AppointmentTime}. Jericho will
                            review this and get back to you shortly.
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"

            - Name: "AskBotWellBeing"
              Description: "Outputs how the bot is doing in a lighthearted manner."
              SampleUtterances:
                - Utterance: "How are you?"
                - Utterance: "How is it going?"
                - Utterance: "Are you doing well?"
                - Utterance: "What's up?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            I'm functioning perfectly at 100% efficiency! Thanks
                            for asking. I am currently keeping track of Jericho's
                            portfolio, tech stack, and schedule. How can I help you
                            navigate his work today?
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"

            - Name: "AskBotCapabilities"
              Description: "Outputs on what can the bot really do, showcasing its engineered personality."
              SampleUtterances:
                - Utterance: "What can you do?"
                - Utterance: "Help me"
                - Utterance: "What are your commands?"
                - Utterance: "How do i use this?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Think of me as your direct pipeline to Jericho's
                            professional profile. You can ask me about his tech
                            stack, view his notable engineering works, get his
                            active contact channels, or type 'schedule a meeting'
                            to seamlessly book an interview slot!
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"

            - Name: "ExpressGratitude"
              Description: "Outputs gratitude to the user when they express thanks."
              SampleUtterances:
                - Utterance: "Thank you"
                - Utterance: "Thanks"
                - Utterance: "Awesome, thanks!"
                - Utterance: "Cool, thank you!"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            You are very welcome! Helping you navigate Jericho's
                            architecture is exactly what I'm built for. Let me know
                            if you need any more details about his stack or availability.
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"

            - Name: "AskBotHumor"
              Description: "Outputs a humorous response to the user."
              SampleUtterances:
                - Utterance: "Tell me a joke"
                - Utterance: "Make me laugh"
                - Utterance: "Do you know any jokes?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Why do Cloud Engineers love dark mode? Because light
                            attract bugs! Speaking of avoiding bugs, would you like
                            to take a look at Jericho's clean, fully-optimized Next.js
                            and AWS works?
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"

            - Name: "AskLoveLife"
              Description: "Handles inquiries regarding relationship status, showcasing a lighthearted easter egg about Kzelyn."
              SampleUtterances:
                - Utterance: "Are you single?"
                - Utterance: "Do you have a girlfriend?"
                - Utterance: "Who is Kzelyn?"
                - Utterance: "Tell me about your love life"
                - Utterance: "Are you dating anyone?"
              IntentClosingSetting:
                ClosingResponse:
                  MessageGroupsList:
                    - Message:
                        PlainTextMessage:
                          Value: >-
                            Jericho is happily taken by Kzelyn! She isn't just his
                            girlfriend; she's also the brilliant marketing student
                            who serves as the research strategist and lead data
                            collector for his major development projects. They are
                            a definitive full-stack duo!
                NextStep:
                  DialogAction:
                    Type: "CloseIntent"
